<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地语音朗读</title>
  <link rel="stylesheet" href="./assets/settings.css">
</head>
<body>
  <main>
    <h1>本地语音朗读</h1>
    <p>朗读来源、声音和语速在 Hana 的「多媒体 → 语音合成 → 本地语音朗读」里设置。</p>
    <p>合成模型有两项：Windows 系统语音、本地 Kokoro。点模型右边的星，把它设成默认。再在下面选声音和语速。语速留空就是 1 倍。</p>
    <h2>供应商试验</h2>
    <p id="probe-status" role="status">正在查看能不能注册成语音供应商…</p>
    <button id="probe" type="button">试一下合成</button>
  </main>
  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
