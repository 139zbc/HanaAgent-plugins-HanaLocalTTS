<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地语音朗读</title>
  <link rel="stylesheet" href="./assets/app.css?v=3">
  <link rel="stylesheet" href="./assets/settings.css?v=10">
</head>
<body>
  <main>
    <p class="hint">朗读来源、声音和语速在 Hana 的「多媒体 → 语音合成 → 本地语音朗读」里设置。这里分开看模型、CPU 运行环境、GPU 运行环境。具备就能用，未下载就点下载。同一时间只跑一套。</p>

    <section class="group">
      <h2>本地 Kokoro</h2>
      <div class="card">
        <div class="row">
          <div class="text">
            <span class="row-title">Python 运行环境</span>
            <span class="row-desc" id="kokoro-python" data-state="loading">正在查看…</span>
          </div>
          <span class="actions">
            <select id="python-source">
              <option value="auto" selected>自动</option>
              <option value="app">App 自带</option>
              <option value="system">系统里的</option>
            </select>
            <button id="download-python" type="button" class="small" hidden>下载</button>
          </span>
        </div>
        <div class="progress-wrap" id="progress-python" hidden>
          <div class="progress-bar"><div class="progress-fill" id="fill-python"></div></div>
          <p class="hint" id="message-python"></p>
        </div>
        <p class="row-error" id="error-python" role="alert" hidden></p>

        <div class="piece" data-component="model">
          <div class="row">
            <div class="text">
              <span class="row-title">模型</span>
              <span class="row-desc" id="kokoro-model" data-state="loading">正在查看…</span>
            </div>
            <span class="actions">
              <select id="install-source">
                <option value="modelscope" selected>ModelScope（国内，推荐）</option>
                <option value="hf-mirror">HF 镜像（国内备选）</option>
                <option value="huggingface">HuggingFace（海外直连）</option>
              </select>
              <button id="download-model" type="button" class="small" hidden>下载</button>
            </span>
          </div>
          <div class="progress-wrap" id="progress-model" hidden>
            <div class="progress-bar"><div class="progress-fill" id="fill-model"></div></div>
            <p class="hint" id="message-model"></p>
          </div>
          <p class="row-error" id="error-model" role="alert" hidden></p>
        </div>

        <div class="piece" data-component="cpu">
          <div class="row">
            <div class="text">
              <span class="row-title">CPU 运行环境</span>
              <span class="row-desc" id="kokoro-cpu" data-state="loading">正在查看…</span>
            </div>
            <span class="actions">
              <select id="pip-source">
                <option value="tuna" selected>清华源（国内，推荐）</option>
                <option value="aliyun">阿里源（国内备选）</option>
                <option value="pypi">PyPI（海外直连）</option>
              </select>
              <button id="download-cpu" type="button" class="small" hidden>下载</button>
            </span>
          </div>
          <div class="progress-wrap" id="progress-cpu" hidden>
            <div class="progress-bar"><div class="progress-fill" id="fill-cpu"></div></div>
            <p class="hint" id="message-cpu"></p>
          </div>
          <p class="row-error" id="error-cpu" role="alert" hidden></p>
        </div>

        <div class="piece" data-component="gpu">
          <div class="row">
            <div class="text">
              <span class="row-title">GPU 运行环境</span>
              <span class="row-desc" id="kokoro-gpu" data-state="loading">正在查看…</span>
            </div>
            <span class="actions">
              <select id="torch-source">
                <option value="nju" selected>南大镜像（国内，推荐）</option>
                <option value="pytorch">PyTorch 官方</option>
              </select>
              <button id="download-gpu" type="button" class="small" hidden>下载</button>
            </span>
          </div>
          <div class="progress-wrap" id="progress-gpu" hidden>
            <div class="progress-bar"><div class="progress-fill" id="fill-gpu"></div></div>
            <p class="hint" id="message-gpu"></p>
          </div>
          <p class="row-error" id="error-gpu" role="alert" hidden></p>
        </div>

        <div class="row">
          <div class="text">
            <span class="row-title">运行状态</span>
            <span class="row-desc" id="kokoro-running" data-state="loading">正在查看…</span>
          </div>
          <span class="actions">
            <button id="kokoro-start" type="button" class="small" hidden>启动</button>
            <button id="kokoro-stop" type="button" class="small" hidden>停止</button>
          </span>
        </div>
        <p class="row-error" id="error-run" role="alert" hidden></p>

        <div class="row">
          <div class="text">
            <span class="row-title">安装路径</span>
            <span class="row-desc mono" id="kokoro-path">—</span>
          </div>
        </div>

        <div class="row">
          <div class="text">
            <span class="row-title">运行模式</span>
            <span class="row-desc" id="kokoro-device" data-state="loading">正在查看…</span>
          </div>
          <span class="actions">
            <select id="device-select" hidden>
              <option value="cpu">CPU</option>
              <option value="cuda">GPU</option>
            </select>
          </span>
        </div>

        <div class="row" id="autostop-row" hidden>
          <div class="text">
            <span class="row-title">自动停止</span>
            <span class="row-desc">Hana 退出时自动停止服务</span>
          </div>
          <label class="switch">
            <input id="autostop-toggle" type="checkbox" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </section>

    <section class="group">
      <h2>安装位置</h2>
      <div class="card">
        <div class="row">
          <div class="text">
            <span class="row-title">模型目录</span>
            <span class="row-desc">模型装在这里。改路径后点保存。</span>
          </div>
        </div>
        <div class="row">
          <div class="path-row">
            <input id="install-root" type="text" spellcheck="false">
            <button id="save-path" type="button" class="primary">保存</button>
          </div>
        </div>
        <p class="row-error" id="error-path" role="alert" hidden></p>
      </div>
    </section>

    <section class="group">
      <h2>供应商试验</h2>
      <div class="card">
        <div class="row">
          <div class="text">
            <span class="row-title">注册状态</span>
            <span class="row-desc" id="probe-status" role="status">正在查看能不能注册成语音供应商…</span>
          </div>
        </div>
        <div class="row">
          <span class="actions only">
            <button id="probe" type="button" class="primary">试一下合成</button>
          </span>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./assets/settings.js?v=13"></script>
</body>
</html>
