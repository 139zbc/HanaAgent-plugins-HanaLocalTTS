<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地语音朗读</title>
  <link rel="stylesheet" href="./assets/settings.css">
</head>
<body>
  <main>
    <h1>本地语音朗读</h1>
    <p id="status" role="status">正在读取已安装的语音…</p>
    <label>声音
      <select id="voice"></select>
    </label>
    <label>语速 <output id="rate-label">1.0</output> 倍
      <input id="rate" type="range" min="0.5" max="2" step="0.1" value="1">
    </label>
    <button id="save" type="button">保存</button>
    <h2>供应商试验</h2>
    <p id="probe-status" role="status">正在查看能不能注册成语音供应商…</p>
    <button id="probe" type="button">试一下合成</button>
  </main>
  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
