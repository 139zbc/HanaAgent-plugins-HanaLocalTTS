<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地语音朗读</title>
  <link rel="stylesheet" href="./assets/app.css?v=5">
  <link rel="stylesheet" href="./assets/panel.css?v=6">
</head>
<body>
  <main class="panel">
    <header class="head">
      <h1>本地语音朗读</h1>
      <p class="sub" id="panel-sub">正在读取状态…</p>
    </header>

    <section class="card" id="panel-body">
      <div class="row">
        <div class="text">
          <span class="row-title">朗读来源</span>
          <span class="row-desc" id="v-engine" data-state="loading">—</span>
        </div>
      </div>
      <div class="row">
        <div class="text">
          <span class="row-title">声音</span>
          <span class="row-desc" id="v-voice" data-state="loading">—</span>
        </div>
      </div>
      <div class="row">
        <div class="text">
          <span class="row-title">语速</span>
          <span class="row-desc" id="v-rate" data-state="loading">—</span>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div class="text">
          <span class="row-title">试听</span>
          <span class="row-desc">写点想听的内容，按当前的声音和语速读出来。</span>
        </div>
      </div>
      <div class="try-box">
        <textarea id="try-text" rows="4" maxlength="500" spellcheck="false" placeholder="想听什么就写什么…"></textarea>
        <div class="try-foot">
          <span class="try-count" id="try-count">0 / 500 字</span>
          <button type="button" class="primary" id="btn-speak">朗读这段文字</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div class="text">
          <span class="row-title">本地模型</span>
          <span class="row-desc" id="v-kokoro" data-state="loading">—</span>
        </div>
      </div>
      <div class="row">
        <div class="text">
          <span class="row-title">运行模式</span>
          <span class="row-desc" id="v-device" data-state="loading">—</span>
        </div>
      </div>
      <div class="foot" id="service-foot" hidden>
        <button type="button" class="small" id="btn-service">启动服务</button>
      </div>
    </section>

    <p class="message" id="panel-message" role="status" hidden></p>

    <p class="hint" id="panel-hint" hidden></p>

    <section class="card error" id="panel-error" hidden>
      <p class="error-text" id="panel-error-text"></p>
      <button type="button" class="small" id="panel-retry">重新读取</button>
    </section>
  </main>
  <script>
    window.addEventListener('error', () => {
      const sub = document.getElementById('panel-sub');
      if (sub) sub.textContent = '页面没起来。请看 App 详情里的报错。';
    }, true);
  </script>
  <script type="module" src="./assets/panel.js?v=9"></script>
</body>
</html>
